name: CI

on:
  push:
  pull_request:

jobs:
  engine-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run engine tests in Docker
        run: docker compose -f docker/docker-compose.test.yml run --rm tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-docker-trx
          path: docker/TestResults/**/*.trx

  windows-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore test1.sln

      - name: Build
        run: dotnet build test1.sln -c Release --no-restore

      - name: Test
        run: dotnet test test1.sln -c Release --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-full-trx
          path: TestResults/**/*.trx